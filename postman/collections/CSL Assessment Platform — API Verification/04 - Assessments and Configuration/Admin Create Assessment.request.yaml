$kind: http-request
name: 'Admin Create Assessment'
method: POST
url: '{{base_url}}/api/csl-admin/assessments/'
order: 2000
headers:
  - key: Cookie
    value: 'sessionid={{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman Test Assessment",
      "description": "Created by automated Postman tests",
      "duration_minutes": 60,
      "max_attempts": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 201", () => pm.expect([200, 201]).to.include(pm.response.code));
      pm.test("Response is JSON", () => pm.response.to.be.json);
      const body = pm.response.json();
      if (body.id) pm.environment.set("assessment_id", String(body.id));
