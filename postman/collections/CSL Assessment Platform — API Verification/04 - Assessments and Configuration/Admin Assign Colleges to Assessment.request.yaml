$kind: http-request
name: 'Admin Assign Colleges to Assessment'
method: POST
url: '{{base_url}}/api/csl-admin/assessments/{{assessment_id}}/assign-colleges/'
order: 4000
headers:
  - key: Cookie
    value: 'sessionid={{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "college_ids": []
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 201 or 204", () => pm.expect([200, 201, 204]).to.include(pm.response.code));
