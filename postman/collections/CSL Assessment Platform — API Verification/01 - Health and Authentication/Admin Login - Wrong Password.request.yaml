$kind: http-request
name: 'Admin Login - Wrong Password'
method: POST
url: '{{base_url}}/api/auth/login/'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@csl.com",
      "password": "wrong_password_xyz"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401 for wrong password", () => pm.response.to.have.status(401));
      pm.test("error field present", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("error");
      });
