$kind: http-request
name: 'Unauthenticated Me Request'
method: GET
url: '{{base_url}}/api/auth/me/'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401 or 403 without auth", () => {
          pm.expect([401, 403]).to.include(pm.response.code);
      });
