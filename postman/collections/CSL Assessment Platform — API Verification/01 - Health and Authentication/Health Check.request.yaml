$kind: http-request
name: 'Health Check'
method: GET
url: '{{base_url}}/health/'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Response is JSON", () => pm.response.to.be.json);
      pm.test("status field is ok", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("status");
          pm.expect(body.status).to.eql("ok");
      });
      pm.test("database field is healthy", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("database");
          pm.expect(body.database).to.eql("healthy");
      });
      pm.test("Response time under 5000ms", () => pm.expect(pm.response.responseTime).to.be.below(5000));
