$kind: http-request
name: 'Logout'
method: POST
url: '{{base_url}}/api/auth/logout/'
order: 5000
headers:
  - key: Cookie
    value: 'sessionid={{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("message is Logged out", () => {
          const body = pm.response.json();
          pm.expect(body.message).to.eql("Logged out.");
      });
