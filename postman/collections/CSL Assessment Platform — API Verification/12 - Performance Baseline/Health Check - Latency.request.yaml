$kind: http-request
name: 'Health Check - Latency'
method: GET
url: '{{base_url}}/health/'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Health check under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      console.log("Health check response time:", pm.response.responseTime, "ms");
