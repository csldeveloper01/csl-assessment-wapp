$kind: http-request
name: 'Admin List Assessments - Latency'
method: GET
url: '{{base_url}}/api/csl-admin/assessments/'
order: 3000
headers:
  - key: Cookie
    value: 'sessionid={{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Assessments list under 3000ms", () => pm.expect(pm.response.responseTime).to.be.below(3000));
      console.log("Assessments list response time:", pm.response.responseTime, "ms");
