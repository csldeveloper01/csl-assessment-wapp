$kind: http-request
name: 'Question Bank Summary (Public)'
method: GET
url: '{{base_url}}/api/assessment/bank-summary/'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Response is JSON", () => pm.response.to.be.json);
