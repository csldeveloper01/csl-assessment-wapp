$kind: http-request
name: 'Get Attempt State - Wrong Candidate'
method: GET
url: '{{base_url}}/api/assessment/attempts/{{attempt_id}}/'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer INVALID_TOKEN_SECURITY_TEST'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401 or 403 for invalid token", () => {
          pm.expect([401, 403]).to.include(pm.response.code);
      });
