$kind: http-request
name: 'Admin Toggle College Status'
method: POST
url: '{{base_url}}/api/csl-admin/colleges/{{college_id}}/toggle-status/'
order: 1000
headers:
  - key: Cookie
    value: 'sessionid={{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 204", () => pm.expect([200, 204]).to.include(pm.response.code));
