$kind: http-request
name: 'Save Answer - Invalid Option'
method: POST
url: '{{base_url}}/api/assessment/attempts/{{attempt_id}}/answer/'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{candidate_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "question_order": 1,
      "selected_option": "Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400 for invalid option", () => pm.response.to.have.status(400));
