$kind: http-request
name: 'Admin Get Section Detail'
method: GET
url: '{{base_url}}/api/csl-admin/sections/{{section_id}}/'
order: 3000
headers:
  - key: Cookie
    value: 'sessionid={{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Section has id and name", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("id");
          pm.expect(body).to.have.property("name");
      });
