$kind: http-request
name: 'Admin Create Section'
method: POST
url: '{{base_url}}/api/csl-admin/sections/'
order: 2000
headers:
  - key: Cookie
    value: 'sessionid={{admin_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test Section",
      "section_type": "APTITUDE",
      "question_count": 5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 or 201", () => pm.expect([200, 201]).to.include(pm.response.code));
      pm.test("Response is JSON", () => pm.response.to.be.json);
      const body = pm.response.json();
      if (body.id) pm.environment.set("section_id", String(body.id));
