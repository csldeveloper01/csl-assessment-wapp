$kind: http-request
name: 'Admin Me - No Auth'
method: GET
url: '{{base_url}}/api/csl-admin/me/'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401 or 403 without auth", () => {
          pm.expect([401, 403]).to.include(pm.response.code);
      });
